<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>buddywong · 账号池控制台</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-accounts" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v4M20 12v3"/></symbol>
  <symbol id="i-logs" viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h11M4 21h7"/></symbol>
  <symbol id="i-checkin" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 5v6h-6"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 8l4 4-4 4M18 12H9"/></symbol>
</svg>

<!-- 登录视图 -->
<div id="login-view" class="login-wrap">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="login-logo">BW</div>
    <h1>buddywong <small class="login-badge">管理员登录</small></h1>
    <p class="login-sub">WorkBuddy 签到 · 账号池反代 · 可视化控制台</p>
    <label class="field">
      <span>管理员账号</span>
      <input id="login-user" name="username" autocomplete="username" value="admin" required>
    </label>
    <label class="field">
      <span>密码</span>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="login-hint">首次启动密码（二选一）：<br>
      ① <code>docker compose logs buddywong | grep -A6 初始管理员</code><br>
      ② 在 compose 里设 <code>BW_ADMIN_PASSWORD</code> 固定密码<br>
      登录后在「设置 → 修改管理密码」改掉。</p>
    <p class="login-hint">进入后台后，到「账号管理 → 扫码登录 WorkBuddy」在页面上直接授权账号并自动签到。</p>
    <p id="login-error" class="form-error hidden"></p>
    <button class="btn primary block" type="submit">登 录</button>
  </form>
</div>

<!-- 主视图 -->
<div id="app-view" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">BW</div>
      <div><strong>buddywong</strong><small>账号池控制台</small></div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-page="dashboard"><svg><use href="#i-dash"/></svg><span>仪表盘</span></button>
      <button class="nav-item" data-page="accounts"><svg><use href="#i-accounts"/></svg><span>账号管理</span></button>
      <button class="nav-item" data-page="keys"><svg><use href="#i-keys"/></svg><span>密钥分发</span></button>
      <button class="nav-item" data-page="logs"><svg><use href="#i-logs"/></svg><span>调用日志</span></button>
      <button class="nav-item" data-page="checkins"><svg><use href="#i-checkin"/></svg><span>签到流水</span></button>
      <button class="nav-item" data-page="settings"><svg><use href="#i-settings"/></svg><span>系统设置</span></button>
    </nav>
    <div class="sidebar-foot">
      <span id="side-version">v-</span>
      <button class="link-btn" id="logout-btn"><svg><use href="#i-logout"/></svg>退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="page-title">仪表盘</h2>
        <p id="page-sub" class="muted"></p>
      </div>
      <div class="topbar-actions">
        <span id="top-time" class="muted mono"></span>
        <button class="btn" id="refresh-btn" title="刷新当前页"><svg><use href="#i-refresh"/></svg>刷新</button>
      </div>
    </header>
    <div id="page" class="page"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<script src="/app.js"></script>
</body>
</html>
