# 打 tag → 构建 Linux Docker 镜像 → 推送阿里云 ACR
#
# 与 git_mcp_server 仓库的 .github/workflows/build-deploy.yml 同一套流程，
# 差别：buddywong 前端是预编译好的静态文件（零 Node 构建），CI 只做 docker build/push。
#
# 本地：pwsh -File script/release.ps1 [v0.0.1]   → 自动递增版本、打 tag、push
# 服务器：bash script/redeploy.sh                  → pull 最新镜像并重启
#
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里配置：
#   ALIYUN_USERNAME       阿里云 ACR 登录用户名
#   ALIYUN_PASSWORD       阿里云 ACR 登录密码（建议用固定密码/访问令牌）
#   ALIYUN_NAMESPACE      ACR 命名空间（本仓库默认 redgreat）
#   DOCKER_IMAGE_NAME     镜像名（本仓库默认 buddywong）
name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  # 可选：手动补发某个已有 tag 的镜像（tag 留空则构建当前默认分支）
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（如 v0.0.1）'
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "构建版本：$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 镜像已推送到阿里云 ACR" >> "$GITHUB_STEP_SUMMARY"
          echo "\`registry.cn-hangzhou.aliyuncs.com/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "服务器执行 \`bash script/redeploy.sh\` 即可完成更新。" >> "$GITHUB_STEP_SUMMARY"
